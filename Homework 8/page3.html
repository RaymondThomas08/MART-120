<html>
     <head>
       <title>Page3contact</title>
       <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
       <link rel="stylesheet" type="text/css" href="PageStyle.css">
       <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>
          <script>
            function checkboxes()
          {
            document.getElementById("fName").style.backgroundColor = "rgb(102, 171, 81)";
            document.getElementById("lName").style.backgroundColor = "rgb(102, 171, 81)";
            document.getElementById("eAdress").style.backgroundColor = "rgb(102, 171, 81)";

            document.getElementById("fNameMessage").innerHTML = "";
            document.getElementById("lNameMessage").innerHTML = "";
            document.getElementById("eAdressMessage").innerHTML = "";

            var firstName = document.getElementById("fName").value;
            var lastName = document.getElementById("lName").value;
            var emailadress = document.getElementById("eAdress").value;
            var isValid = true;
            if(firstName == "")
            {
                document.getElementById("fName").focus();
                document.getElementById("fName").style.backgroundColor = "red";
                document.getElementById("fNameMessage").innerHTML = "* Required Field";
                document.getElementById("fNameMessage").style.color = "red";
                isValid = false;
           }
            if(lastName == "")
            {
              document.getElementById("lName").focus();
              document.getElementById("lName").style.backgroundColor = "red";
              document.getElementById("lNameMessage").innerHTML = "* Required Field";
              document.getElementById("lNameMessage").style.color = "red";
              isValid = false;
            }
                
            
            if(emailadress == "")
            {
                document.getElementById("eAdress").focus();
                document.getElementById("eAdress").style.backgroundColor = "red";
                document.getElementById("eAdressMessage").innerHTML = "* Required Field";
                document.getElementById("eAdressMessage").style.color = "red";
                isValid = false; 
            }
                if(!isValid)
               {
                if(firstName == "")
                  {
                  document.getElementById("fName").focus();
                  }
                  else if(lastName == "")
                  {
                   document.getElementById("lName").focus();
                  }
                  else
                  {
                  document.getElementById("eAdress").focus();
                  }
            }
          return isValid;
          }
          function radiobuttons()
        {
            var selected = document.querySelector('input[name="optradio"]:checked');

          if(selected == null)
          {
            window.alert("Please select Yes or No.");
          }
          else if(selected.value == "No")
          {
           window.alert("You must accept the terms of agreement to continue.");
          }
          else
          {
            window.alert("Thank you for accepting the terms of agreement.");
          }

          }
        
          </script>
       </head>
   
    <body>
        <p><h1><span id="SpecificHeader">Welcome to The Contact Page!</span></h1></p>
        <br />
        <h2>Please enter your name and email adress below:</h2>
        <br />
        <form type="POST">
             First Name: <input type="text" id="fName" style="background-color: rgb(102, 171, 81)">&nbsp;<span id="fNameMessage"></span>
             <br />
             <br />
             Last Name: <input type="text" id="lName" style="background-color: rgb(102, 171, 81)">&nbsp;<span id="lNameMessage"></span>
             <br />
             <br />
             Email Adress:<input type="text" id="eAdress" style="background-color: rgb(102, 171, 81)">&nbsp;<span id="eAdressMessage"></span>
             <br />
             <br />
             <button type="button" class="btn btn-success" onclick='checkboxes();'>Submit</button>
        </form>
          <br />
          <br />
         <h2>Did you like this website?</h2>
         <select>
            <option value="Yes">Yes</option>
            <option value="No">No</option>
            <option value="Kind of">Kind of</option>
         </select>
         <br />
         <br />
         <br />
         <h2>Terms and Conditions</h2>
         <br />
         Do you accept the terms of agreement?
         <br />
         <br /> 
         <div class="form-check">
        <label class="form-check-label">
        <input type="radio" class="form-check-input" name="optradio" value="Yes" id="yes">Yes
        </label>
        </div>
        <br />
        <div class="form-check">
        <label class="form-check-label">
        <input type="radio" class="form-check-input" name="optradio" value="No" id="no">No
        </label>
        <br />
        <br />
        <button type="button" class="btn btn-danger" onclick='radiobuttons();'>Agree</button>
         </div>
